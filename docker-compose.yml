services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
    - ./data:/srv/data
    environment:
      EXAM_DB_PATH: /srv/data/scheduler.db
  nginx:
    build:
      context: ./nginx
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped